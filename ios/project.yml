# よりどころの iOS アプリ（iPhone と iPad）。xcodegen generate --spec ios/project.yml で FamilyHub.xcodeproj を作る（生成物はリポジトリに入れない）。
name: FamilyHub
options:
  bundleIdPrefix: example.familyhub
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: ja
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  FamilyHubKit:
    path: Packages/FamilyHubKit
targets:
  FamilyHub:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: FamilyHubKit
        product: FHFeatures
      - package: FamilyHubKit
        product: FHGateway
      - package: FamilyHubKit
        product: FHDesign
      - package: FamilyHubKit
        product: FHModel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FH_BUNDLE_PREFIX).app
        PRODUCT_NAME: FamilyHub
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: よりどころ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
schemes:
  FamilyHub:
    build:
      targets:
        FamilyHub: all
    run:
      config: Debug
    test:
      config: Debug
