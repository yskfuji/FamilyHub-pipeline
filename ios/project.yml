# よりどころの iOS アプリ（iPhone と iPad）。xcodegen generate --spec ios/project.yml で FamilyHub.xcodeproj を作る（生成物はリポジトリに入れない）。
name: FamilyHub
options:
  bundleIdPrefix: example.familyhub
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: ja
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  FamilyHubKit:
    path: Packages/FamilyHubKit
targets:
  FamilyHub:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info*.plist"
    dependencies:
      - package: FamilyHubKit
        product: FHFeatures
      - package: FamilyHubKit
        product: FHGateway
      - package: FamilyHubKit
        product: FHDesign
      - package: FamilyHubKit
        product: FHModel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FH_BUNDLE_PREFIX).app
        PRODUCT_NAME: FamilyHub
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: よりどころ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
      configs:
        # Debug だけ、同じ Mac の http（127.0.0.1）を許す（App/Info-Debug.plist）。
        Debug:
          INFOPLIST_FILE: App/Info-Debug.plist
  FamilyHubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: FamilyHub
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # サーバーにつなぐ試験は、試験の側からも 127.0.0.1 の開発サーバーを http で呼ぶ（UITests-Info.plist）。
        INFOPLIST_FILE: UITests-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(FH_BUNDLE_PREFIX).uitests
        TEST_TARGET_NAME: FamilyHub
schemes:
  FamilyHub:
    build:
      targets:
        FamilyHub: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FamilyHubUITests
