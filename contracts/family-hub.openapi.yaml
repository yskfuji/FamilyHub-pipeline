openapi: 3.1.0
info:
  title: Family Hub Gateway
  version: 1.0.0
  description: >-
    Reference boundary. All authenticated operations use server-managed __Host-
    Secure HttpOnly SameSite cookies. Mutations require CSRF token and Origin /
    Fetch Metadata verification. Authentication secrets are never returned.
    Place lookup goes directly from the client to OpenPOI API with a rounded
    position and never passes through this API; only the chosen PlaceRef is
    stored here and it is returned only to members holding place.read.
servers:
  - url: https://api.example.invalid
    description: Must be injected by the deploying environment
security:
  - sessionCookie: []
x-mutation-policy:
  description: >-
    Every non-GET request is verified server-side with the session cookie, CSRF
    token, Origin and Fetch Metadata. Idempotency-Key is required, and
    If-Permission-Revision is required after a household has been selected.
    Authorization is evaluated for every request; client-side visibility is not
    an authorization boundary. Membership, invitation, permission and financial
    operations additionally require recent reauthentication and an audit event.
  idempotencyHeader: Idempotency-Key
  permissionRevisionHeader: If-Permission-Revision
  csrfHeader: X-CSRF-Token
paths:
  /v1/auth/passkey/challenge:
    post:
      security: []
      operationId: beginPasskey
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: WebAuthn challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyChallenge' }
        default: { $ref: '#/components/responses/Error' }
  /v1/auth/passkey/complete:
    post:
      security: []
      operationId: finishPasskey
      description: The server verifies the assertion signature, origin, RP ID, and the single-use challenge before issuing the session cookie.
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, assertion]
              properties:
                challengeId: { type: string }
                assertion: { type: object, additionalProperties: true, description: PublicKeyCredential assertion (base64url fields) }
      responses:
        '200':
          description: Signed in; session cookie set by server
          content:
            application/json:
              schema: { type: object, required: [userId], properties: { userId: { type: string } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/auth/password:
    post:
      security: []
      operationId: signInWithPassword
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 15, maxLength: 64 }
      responses:
        '204': { description: Session cookie set by server }
        default: { $ref: '#/components/responses/Error' }
  /v1/auth/session:
    delete:
      operationId: signOut
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '204': { description: Session revoked }
        default: { $ref: '#/components/responses/Error' }
  /v1/auth/security:
    get:
      operationId: getSecurityOverview
      responses:
        '200':
          description: Authenticators and sessions without secrets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityOverview' }
        default: { $ref: '#/components/responses/Error' }
  /v1/auth/passkeys/registration:
    post:
      operationId: beginPasskeyRegistration
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: Short-lived WebAuthn registration challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyRegistrationChallenge' }
        default: { $ref: '#/components/responses/Error' }
  /v1/auth/passkeys/registration/complete:
    post:
      operationId: finishPasskeyRegistration
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, credential]
              properties:
                challengeId: { type: string }
                credential: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Authenticator registered after origin and challenge verification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Authenticator' }
        default: { $ref: '#/components/responses/Error' }
  /v1/auth/password/change:
    post:
      operationId: changePassword
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, minLength: 15, maxLength: 64 }
                newPassword: { type: string, minLength: 15, maxLength: 64 }
      responses:
        '204': { description: Password changed; breached values rejected server-side }
        default: { $ref: '#/components/responses/Error' }
  /v1/auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Exactly the requested non-current session was revoked }
        default: { $ref: '#/components/responses/Error' }
  /v1/households/current/snapshot:
    get:
      operationId: getHouseholdSnapshot
      responses:
        '200':
          description: Current household projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdSnapshot' }
        default: { $ref: '#/components/responses/Error' }
  /v1/household-invites/accept:
    post:
      operationId: acceptInvite
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: { code: { type: string, minLength: 20, maxLength: 256 } }
      responses:
        '200':
          description: Membership created
          content:
            application/json:
              schema:
                type: object
                properties: { householdId: { type: string } }
        '410': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/household-invites:
    get:
      operationId: listHouseholdInvites
      responses:
        '200':
          description: Owner-only invitation list; tokens are never returned again
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/HouseholdInvite' } }
        '403': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createHouseholdInvite
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties: { role: { enum: [adult, child, guest] } }
      responses:
        '201':
          description: 24-hour, single-use token returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdInvite' }
        default: { $ref: '#/components/responses/Error' }
  /v1/household-invites/{inviteId}:
    delete:
      operationId: revokeHouseholdInvite
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { name: inviteId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Invite revoked and audit event appended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdInvite' }
        '403': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/household-memberships/{membershipId}:
    patch:
      operationId: updateMembershipRole
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { name: membershipId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, expectedVersion]
              properties:
                role: { enum: [owner, adult, child, guest] }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Role updated; sole owner demotion is rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdMembership' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/household-memberships/{membershipId}/permission-overrides:
    get:
      operationId: getPermissionOverrides
      parameters:
        - { name: membershipId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Owner-only individual allow and deny overrides
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PermissionOverride' } } } }
        '403': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: updatePermissionOverrides
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { name: membershipId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [overrides, expectedPermissionRevision]
              properties:
                overrides: { type: array, items: { $ref: '#/components/schemas/PermissionOverride' } }
                expectedPermissionRevision: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated snapshot; deny wins and role ceiling is enforced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdSnapshot' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: resetPermissionOverrides
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { name: membershipId, in: path, required: true, schema: { type: string } }
        - { name: expectedPermissionRevision, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Role defaults restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdSnapshot' }
        default: { $ref: '#/components/responses/Error' }
  /v1/households/current:
    patch:
      operationId: updateHouseholdProfile
      description: Owner only. Renames the household.
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties: { name: { type: string, minLength: 1, maxLength: 40 } }
      responses:
        '200':
          description: Updated household
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Household' }
        default: { $ref: '#/components/responses/Error' }
  /v1/households/current/privacy:
    get:
      operationId: getPrivacySettings
      description: Returns the signed-in member's own privacy settings, including place-lookup consent.
      responses:
        '200':
          description: Current privacy settings of the requesting member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacySettings' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: savePrivacySettings
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivacySettings' }
      responses:
        '200':
          description: >-
            Privacy defaults saved; never implies public access. The server stamps
            placeLookupConsent.grantedAt itself, accepts only the current noticeVersion,
            and appends an AuditEvent when consent is granted or revoked. The server
            rejects a noticeVersion that does not match its currently published notice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacySettings' }
        default: { $ref: '#/components/responses/Error' }
  /v1/events:
    post:
      operationId: createEvent
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/PermissionRevision' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        default: { $ref: '#/components/responses/Error' }
  /v1/events/{eventId}:
    patch:
      operationId: updateRecurringEvent
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, input, expectedVersion]
              properties:
                scope: { enum: [this, future, series] }
                input: { $ref: '#/components/schemas/EventPatch' }
                expectedVersion: { type: integer, minimum: 1 }
                occurrenceDate: { type: string, format: date, description: Required when scope is this or future on a recurring event }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteEvent
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { name: eventId, in: path, required: true, schema: { type: string } }
        - { name: scope, in: query, required: true, schema: { enum: [this, future, series] } }
        - { name: expectedVersion, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: occurrenceDate, in: query, required: false, schema: { type: string, format: date }, description: Required when scope is this or future on a recurring event }
      responses:
        '204': { description: Event scope soft-deleted for seven days after authorization and version checks }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/events/{eventId}/restore:
    post:
      operationId: restoreEvent
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { name: eventId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Soft-deleted event restored within seven days
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        default: { $ref: '#/components/responses/Error' }
  /v1/todos:
    post:
      operationId: createTodo
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/PermissionRevision' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        default: { $ref: '#/components/responses/Error' }
  /v1/todos/{todoId}/status:
    patch:
      operationId: updateTodoStatus
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - name: todoId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, expectedVersion]
              properties:
                status: { enum: [open, doing, review, done] }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/todos/{todoId}:
    patch:
      operationId: updateTodo
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { name: todoId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, input, expectedVersion]
              properties:
                scope: { enum: [this, future, series] }
                input: { $ref: '#/components/schemas/TodoPatch' }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Todo updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteTodo
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { name: todoId, in: path, required: true, schema: { type: string } }
        - { name: expectedVersion, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: scope, in: query, required: false, schema: { enum: [this, future, series], default: series }, description: this skips only the current occurrence of a recurring task and advances the series }
      responses:
        '204': { description: Deleted (or the current occurrence skipped); restorable for seven days }
        default: { $ref: '#/components/responses/Error' }
  /v1/todos/{todoId}/restore:
    post:
      operationId: restoreTodo
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { name: todoId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Todo restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        default: { $ref: '#/components/responses/Error' }
  /v1/memos:
    post:
      operationId: createMemo
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/PermissionRevision' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body, tags]
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                body: { type: string, minLength: 1, maxLength: 5000 }
                tags: { type: array, maxItems: 10, items: { type: string, maxLength: 30 } }
                place:
                  description: PlaceRef to attach; null is treated as absent. Requires place.read.
                  oneOf:
                    - { $ref: '#/components/schemas/PlaceRef' }
                    - { type: 'null' }
      responses:
        '201':
          description: Memo created; place requires place.read
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Memo' }
        default: { $ref: '#/components/responses/Error' }
  /v1/memos/{memoId}:
    patch:
      operationId: updateMemo
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/PermissionRevision' }
        - { name: memoId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input, expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                input:
                  type: object
                  additionalProperties: false
                  properties:
                    title: { type: string, minLength: 1, maxLength: 120 }
                    body: { type: string, minLength: 1, maxLength: 5000 }
                    tags: { type: array, maxItems: 10, items: { type: string, maxLength: 30 } }
                    place:
                      description: PlaceRef to set, or null to remove. Omitted means unchanged. Requires place.read.
                      oneOf:
                        - { $ref: '#/components/schemas/PlaceRef' }
                        - { type: 'null' }
      responses:
        '200':
          description: Memo updated after version and authorization checks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Memo' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteMemo
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { name: memoId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Soft deleted for seven days }
        default: { $ref: '#/components/responses/Error' }
  /v1/memos/{memoId}/restore:
    post:
      operationId: restoreMemo
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { name: memoId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Memo restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Memo' }
        default: { $ref: '#/components/responses/Error' }
  /v1/memos/{memoId}/attachments:
    post:
      operationId: uploadAttachment
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - name: memoId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '202':
          description: Accepted into quarantine; not safe to serve yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Memo' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/memos/{memoId}/attachments/{attachmentId}/link:
    get:
      operationId: getAttachmentLink
      description: Issues a short-lived signed URL only for attachments whose scan status is clean and only to viewers allowed to read the memo.
      parameters:
        - { name: memoId, in: path, required: true, schema: { type: string } }
        - { name: attachmentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Short-lived signed URL
          content:
            application/json:
              schema: { type: object, required: [url, expiresAt], properties: { url: { type: string, format: uri }, expiresAt: { type: string, format: date-time } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/expenses:
    post:
      operationId: createExpense
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '201':
          description: Created; server recomputes integer shares
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        default: { $ref: '#/components/responses/Error' }
  /v1/expenses/{expenseId}:
    patch:
      operationId: updateExpense
      description: Amount, payer and shares can change only while no live (unreversed) settlement exists; otherwise 409.
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: expenseId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input, expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                input: { $ref: '#/components/schemas/ExpensePatch' }
      responses:
        '200':
          description: Updated expense
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteExpense
      description: Rejected with 409 while a live settlement exists. Soft delete; restorable for seven days.
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { name: expenseId, in: path, required: true, schema: { type: string } }
        - { name: expectedVersion, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: Soft deleted for seven days }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/expenses/{expenseId}/restore:
    post:
      operationId: restoreExpense
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { name: expenseId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Restored expense
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        default: { $ref: '#/components/responses/Error' }
  /v1/expenses/{expenseId}/settlements:
    post:
      operationId: recordSettlement
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - name: expenseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromMembershipId, amountJpy]
              properties:
                fromMembershipId: { type: string, description: The member whose share is being settled }
                amountJpy: { type: integer, minimum: 1, description: Capped at the member's remaining share }
      responses:
        '201':
          description: Append-only settlement record created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/expenses/{expenseId}/settlements/{settlementId}/reverse:
    post:
      operationId: reverseSettlement
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { name: expenseId, in: path, required: true, schema: { type: string } }
        - { name: settlementId, in: path, required: true, schema: { type: string } }
      responses:
        '201':
          description: Append-only reversal record created; original remains auditable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        default: { $ref: '#/components/responses/Error' }
  /v1/search:
    get:
      operationId: searchHousehold
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200':
          description: Authorized household results only
          content:
            application/json:
              schema:
                type: array
                maxItems: 12
                items:
                  type: object
                  required: [kind, id, label, destination]
                  properties:
                    kind: { enum: [event, task, memo, expense, place, resource] }
                    detail: { type: string }
                    id: { type: string }
                    label: { type: string }
                    destination: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /v1/insights:
    get:
      operationId: listInsights
      description: Derived on the server from the requester's authorized projection only; requires insight.read. Never changes events or assignments.
      responses:
        '200':
          description: Insights for the requesting member
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Insight' } }
        default: { $ref: '#/components/responses/Error' }
  /v1/notifications:
    get:
      operationId: listNotifications
      responses:
        '200':
          description: Authorized household notifications
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/HouseholdNotification' } }
        default: { $ref: '#/components/responses/Error' }
  /v1/notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { name: notificationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Notification marked read
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdNotification' }
        default: { $ref: '#/components/responses/Error' }
  /v1/notifications/{notificationId}/snooze:
    post:
      operationId: snoozeNotification
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { name: notificationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties: { minutes: { type: integer, enum: [30] } }
      responses:
        '200':
          description: Notification reminder moved by 30 minutes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdNotification' }
        default: { $ref: '#/components/responses/Error' }
  /v1/notifications/{notificationId}/stop:
    post:
      operationId: stopNotification
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { name: notificationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Notification stopped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdNotification' }
        default: { $ref: '#/components/responses/Error' }
  /v1/notifications/{notificationId}/resume:
    post:
      operationId: resumeNotification
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { name: notificationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Notification resumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdNotification' }
        default: { $ref: '#/components/responses/Error' }
  /v1/notification-preferences:
    get:
      operationId: getNotificationPreferences
      responses:
        '200':
          description: Notification preference snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateNotificationPreferences
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                todoDue: { type: boolean }
                eventDeparture: { type: boolean }
                quietHours: { type: boolean }
      responses:
        '200':
          description: Notification preferences updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-family_session
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    PermissionRevision:
      name: If-Permission-Revision
      in: header
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    Error:
      description: Stable discriminated error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/GatewayError' }
  schemas:
    GatewayError:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          enum: [UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, REAUTH_REQUIRED, INVALID_INPUT, CONFLICT, OFFLINE, RATE_LIMITED, UPSTREAM_FAILURE, ATTACHMENT_REJECTED]
        message: { type: string }
        retryable: { type: boolean }
        reason:
          enum: [CAPABILITY_MISSING, SCOPE_DENIED, MEMBERSHIP_INACTIVE, OWNER_REQUIRED, VERSION, PERMISSION_REVISION, IDEMPOTENCY]
        fieldErrors:
          type: object
          additionalProperties: { type: string }
    PasskeyChallenge:
      type: object
      required: [challengeId, publicKey]
      properties:
        challengeId: { type: string }
        publicKey: { type: object, additionalProperties: true }
    Recurrence:
      type: object
      required: [rrule, timezone, exceptions]
      properties:
        rrule: { type: string, pattern: '^FREQ=' }
        timezone: { type: string, example: Asia/Tokyo }
        exceptions:
          type: array
          items: { type: string, format: date }
    EventInput:
      type: object
      required: [title, startsAt, endsAt, timezone, participantMembershipIds]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string, example: Asia/Tokyo }
        participantMembershipIds:
          type: array
          minItems: 1
          items: { type: string }
        recurrence: { $ref: '#/components/schemas/Recurrence' }
        location: { type: string, maxLength: 200 }
        note: { type: string, maxLength: 2000 }
        weatherSensitive: { type: boolean }
    EventPatch:
      description: Partial EventInput. endsAt must stay after startsAt after merging.
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string }
        participantMembershipIds: { type: array, minItems: 1, items: { type: string } }
        recurrence: { $ref: '#/components/schemas/Recurrence' }
        location: { type: string, maxLength: 200 }
        note: { type: string, maxLength: 2000 }
        weatherSensitive: { type: boolean }
    Event:
      allOf:
        - { $ref: '#/components/schemas/EventInput' }
        - type: object
          required: [id, householdId, ownerMembershipId, version, visibility]
          properties:
            id: { type: string }
            householdId: { type: string }
            ownerMembershipId: { type: string }
            version: { type: integer, minimum: 1 }
            visibility: { $ref: '#/components/schemas/VisibilityPolicy' }
            resourceIds: { type: array, items: { type: string } }
            deletedAt: { type: string, format: date-time }
    TodoInput:
      type: object
      required: [title, assigneeMembershipId]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        dueAt: { type: string, format: date-time }
        assigneeMembershipId: { type: string }
        reviewerMembershipId: { type: string }
        note: { type: string, maxLength: 2000 }
    TodoPatch:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        dueAt: { type: string, format: date-time }
        assigneeMembershipId: { type: string }
        reviewerMembershipId: { type: string }
        note: { type: string, maxLength: 2000 }
    Todo:
      allOf:
        - { $ref: '#/components/schemas/TodoInput' }
        - type: object
          required: [id, householdId, status, creatorMembershipId, version, visibility]
          properties:
            id: { type: string }
            householdId: { type: string }
            status: { enum: [open, doing, review, done] }
            creatorMembershipId: { type: string }
            recurrence: { $ref: '#/components/schemas/Recurrence' }
            version: { type: integer, minimum: 1 }
            visibility: { $ref: '#/components/schemas/VisibilityPolicy' }
            deletedAt: { type: string, format: date-time }
    Attachment:
      type: object
      required: [id, status, originalName, mimeType, byteSize]
      properties:
        id: { type: string }
        status: { enum: [selected, validating, quarantined, clean, rejected] }
        originalName: { type: string }
        mimeType: { enum: [application/pdf, image/jpeg, image/png] }
        byteSize: { type: integer, maximum: 10000000 }
        memoId: { type: string }
        statusMessage: { type: string }
    Memo:
      type: object
      required: [id, householdId, title, body, tags, updatedAt, authorMembershipId, attachments, visibility, version]
      properties:
        id: { type: string }
        householdId: { type: string }
        title: { type: string, maxLength: 120 }
        body: { type: string, maxLength: 5000 }
        tags: { type: array, maxItems: 10, items: { type: string, maxLength: 30 } }
        updatedAt: { type: string, format: date-time }
        authorMembershipId: { type: string }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        ocrText: { type: string }
        place: { $ref: '#/components/schemas/PlaceRef' }
        visibility: { $ref: '#/components/schemas/VisibilityPolicy' }
        version: { type: integer, minimum: 1 }
        deletedAt: { type: string, format: date-time }
    ExpenseInput:
      type: object
      required: [title, amountJpy, incurredOn, payerMembershipId, shareMembershipIds]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        amountJpy: { type: integer, minimum: 1 }
        incurredOn: { type: string, format: date }
        payerMembershipId: { type: string }
        shareMembershipIds:
          type: array
          minItems: 1
          items: { type: string }
        category: { enum: [food, transport, education, home, other], default: other }
        note: { type: string, maxLength: 500 }
        place: { $ref: '#/components/schemas/PlaceRef' }
    ExpensePatch:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        amountJpy: { type: integer, minimum: 1 }
        incurredOn: { type: string, format: date }
        payerMembershipId: { type: string }
        shareMembershipIds: { type: array, minItems: 1, items: { type: string } }
        category: { enum: [food, transport, education, home, other] }
        note: { oneOf: [{ type: string, maxLength: 500 }, { type: 'null' }] }
        place: { oneOf: [{ $ref: '#/components/schemas/PlaceRef' }, { type: 'null' }] }
    ExpenseShare:
      type: object
      required: [membershipId, amountJpy, settledJpy]
      properties:
        membershipId: { type: string }
        amountJpy: { type: integer, minimum: 0 }
        settledJpy: { type: integer, minimum: 0 }
    SettlementRecord:
      type: object
      description: Append-only. A reversal is a new record with a negative amount that points to the original.
      required: [id, amountJpy, fromMembershipId, toMembershipId, recordedAt]
      properties:
        id: { type: string }
        amountJpy: { type: integer }
        fromMembershipId: { type: string }
        toMembershipId: { type: string }
        recordedAt: { type: string, format: date-time }
        reversedAt: { type: string, format: date-time }
        reversalOfSettlementId: { type: string }
    Expense:
      type: object
      required: [id, householdId, title, amountJpy, incurredOn, payerMembershipId, category, shares, settlements, version]
      properties:
        id: { type: string }
        householdId: { type: string }
        title: { type: string, maxLength: 120 }
        amountJpy: { type: integer, minimum: 1 }
        incurredOn: { type: string, format: date }
        payerMembershipId: { type: string }
        category: { enum: [food, transport, education, home, other] }
        shares: { type: array, items: { $ref: '#/components/schemas/ExpenseShare' } }
        settlements: { type: array, items: { $ref: '#/components/schemas/SettlementRecord' } }
        note: { type: string, maxLength: 500 }
        place: { $ref: '#/components/schemas/PlaceRef' }
        version: { type: integer, minimum: 1 }
        deletedAt: { type: string, format: date-time }
    Household:
      type: object
      required: [id, name, timezone]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 40 }
        timezone: { const: Asia/Tokyo }
    Insight:
      type: object
      required: [id, title, summary, evidence, actionLabel, destination, confidence]
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        evidence: { type: string }
        actionLabel: { type: string }
        destination: { type: string }
        confidence: { enum: [high, medium, low] }
    HouseholdNotification:
      type: object
      required: [id, kind, destination, title, body, remindAt, read, status]
      properties:
        id: { type: string }
        kind: { enum: [todoDue, eventDeparture] }
        destination: { type: string }
        title: { type: string }
        body: { type: string }
        remindAt: { type: string, format: date-time, description: Already moved to 07:00 when quiet hours apply }
        read: { type: boolean }
        status: { enum: [active, snoozed, stopped] }
    NotificationPreferences:
      type: object
      additionalProperties: false
      required: [todoDue, eventDeparture, quietHours]
      properties:
        todoDue: { type: boolean }
        eventDeparture: { type: boolean }
        quietHours: { type: boolean }
    PlaceProvenance:
      type: object
      additionalProperties: false
      required: [provider, source, licenses, attributions]
      properties:
        provider: { const: openpoi }
        source: { type: string, minLength: 1, maxLength: 40 }
        licenses: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 200 } }
        attributions: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 300 } }
    PlaceRef:
      type: object
      description: >-
        The place a member chose for a memo or expense. Never contains the member's
        own device or photo position or its accuracy. Returned only to viewers that
        hold place.read (owners and adults; never children or guests). Manual entries
        carry neither coordinates nor provenance; looked-up places carry both.
      additionalProperties: false
      required: [name, capturedVia, selectedAt]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        address: { type: string, minLength: 1, maxLength: 200 }
        coordinates:
          type: object
          additionalProperties: false
          required: [lat, lng]
          properties:
            lat: { type: number, minimum: -90, maximum: 90, description: 'WGS84. At most five decimal places (about 1 m); rounded by the client and re-validated by the server.' }
            lng: { type: number, minimum: -180, maximum: 180, description: 'WGS84. At most five decimal places (about 1 m); rounded by the client and re-validated by the server.' }
        category: { type: string, minLength: 1, maxLength: 40 }
        provenance: { $ref: '#/components/schemas/PlaceProvenance' }
        capturedVia: { enum: [device, photo, search, manual] }
        selectedAt: { type: string, format: date-time }
      oneOf:
        - description: Manual entry carries neither coordinates nor provenance.
          properties: { capturedVia: { const: manual } }
          not: { anyOf: [{ required: [coordinates] }, { required: [provenance] }] }
        - description: Looked-up places carry both coordinates and provenance.
          properties: { capturedVia: { enum: [device, photo, search] } }
          required: [coordinates, provenance]
    PlaceLookupConsent:
      type: object
      additionalProperties: false
      required: [noticeVersion, grantedAt]
      properties:
        noticeVersion: { type: string, maxLength: 40 }
        grantedAt: { type: string, format: date-time, description: Stamped by the server }
    PrivacySettings:
      type: object
      additionalProperties: false
      required: [defaultAudience, hideNotificationContent, placeLookupConsent]
      properties:
        defaultAudience: { enum: [household, creator] }
        hideNotificationContent: { type: boolean }
        placeLookupConsent:
          oneOf:
            - { $ref: '#/components/schemas/PlaceLookupConsent' }
            - { type: 'null' }
    Authenticator:
      type: object
      required: [id, label, createdAt, kind, demo]
      properties:
        id: { type: string }
        label: { type: string }
        createdAt: { type: string, format: date-time }
        kind: { const: passkey }
        demo: { type: boolean }
    Session:
      type: object
      required: [id, label, location, lastSeenAt, current]
      properties:
        id: { type: string }
        label: { type: string }
        location: { type: string }
        lastSeenAt: { type: string, format: date-time }
        current: { type: boolean }
    SecurityOverview:
      type: object
      description: Never contains credential secrets or public keys.
      required: [authenticators, sessions]
      properties:
        authenticators: { type: array, items: { $ref: '#/components/schemas/Authenticator' } }
        sessions: { type: array, items: { $ref: '#/components/schemas/Session' } }
    PasskeyRegistrationChallenge:
      type: object
      required: [challengeId, publicKey]
      properties:
        challengeId: { type: string }
        publicKey: { type: [object, 'null'], additionalProperties: true, description: PublicKeyCredentialCreationOptions with base64url fields }
    HouseholdInvite:
      type: object
      required: [id, householdId, role, expiresAt, remainingUses]
      properties:
        id: { type: string }
        householdId: { type: string }
        role: { enum: [adult, child, guest] }
        token: { type: string, description: Returned only once in the create response; list responses omit it }
        expiresAt: { type: string, format: date-time }
        remainingUses: { type: integer, minimum: 0 }
        revokedAt: { type: string, format: date-time }
    HouseholdMembership:
      type: object
      required: [id, householdId, userId, displayName, role, status, version]
      properties:
        id: { type: string }
        householdId: { type: string }
        userId: { type: string }
        displayName: { type: string }
        role: { enum: [owner, adult, child, guest] }
        status: { enum: [active, invited, suspended] }
        color: { type: string }
        version: { type: integer, minimum: 1 }
    PermissionOverride:
      type: object
      required: [membershipId, capability, effect]
      properties:
        membershipId: { type: string }
        capability: { type: string }
        effect: { enum: [allow, deny] }
    VisibilityPolicy:
      type: object
      required: [audience, creatorMembershipId, selectedMembershipIds]
      properties:
        audience: { enum: [household, adults, participants, creator, selected] }
        creatorMembershipId: { type: string }
        selectedMembershipIds: { type: array, items: { type: string } }
    ViewerContext:
      type: object
      required: [userId, membershipId, role, status, capabilities, permissionRevision]
      properties:
        userId: { type: string }
        membershipId: { type: string }
        role: { enum: [owner, adult, child, guest] }
        status: { enum: [active, invited, suspended] }
        capabilities: { type: array, items: { type: string } }
        permissionRevision: { type: integer, minimum: 1 }
    HouseholdSnapshot:
      type: object
      description: Server-authorized projection. The server derives viewer and capabilities from the session and never trusts client-supplied roles.
      required: [viewer, permissionOverrides]
      properties:
        viewer: { $ref: '#/components/schemas/ViewerContext' }
        permissionOverrides: { type: array, items: { $ref: '#/components/schemas/PermissionOverride' } }
      additionalProperties: true
