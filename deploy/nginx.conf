server {
  listen 443 ssl http2;
  server_name family.example;
  root /srv/family-hub;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' https://api.openpoiapi.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  # 古いブラウザ向け。今のブラウザは CSP の frame-ancestors で足りる（侵入試験 PT-HEADERS）。
  add_header X-Frame-Options "DENY" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;

  # API は同じオリジンで受ける。ここで add_header を書くと上の見出しが消えるので書かない。
  location /v1/ {
    proxy_pass http://127.0.0.1:8799;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 添付の上限（130MiB）に合わせる。アルバムの動画は8MiBずつ分けて届く。
    client_max_body_size 140m;
    proxy_request_buffering off;
  }

  # 画面のファイルは、ビルドで前もって圧縮した .gz（gzip -9）をそのまま配る。圧縮のための CPU を使わない。
  # gzip_static は ngx_http_gzip_static_module を使う（多くの配布の nginx に入っている。自分でビルドするなら --with-http_gzip_static_module）。
  # .br は作っていない。brotli_static は ngx_brotli がないと nginx が起動しないため（deploy/README.md）。
  # 静的ホスティング用の見出しの設定（public/_headers）は配らない（侵入試験 PT-HEADERS）。
  location = /_headers {
    return 404;
  }

  location / {
    gzip_static on;
    gzip_vary on;
    try_files $uri $uri/ /index.html;
  }
}
